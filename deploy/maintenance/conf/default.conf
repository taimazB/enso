# The maintenance stand-in. It binds the SAME host ports as `front` and `api`,
# so it can only run while those two are stopped — which is the point: a proxy
# in front of a stopped container shows its own 502, and a visitor cannot tell
# that from the site being broken.
#
# Everything answers 503, never 200. A maintenance page served as 200 gets
# cached by intermediaries and indexed by crawlers, and uptime monitors record
# the outage as a healthy site.

# The frontend's port: a human gets a page.
server {
    listen 3000;
    server_tokens off;
    root /usr/share/nginx/html;

    location / {
        return 503;
    }

    # No `=200` here on purpose — nginx keeps the 503 while serving the body.
    error_page 503 /index.html;
    location = /index.html {
        internal;
        add_header Retry-After 3600 always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
}

# The API's port: a program gets JSON, in the same shape SERVER.py's errors use
# (`detail` as a plain sentence, `error.code` as the machine-readable half), so
# a client that already parses one parses this.
server {
    listen 4000;
    server_tokens off;
    default_type application/json;

    location / {
        # The preflight must SUCCEED for any of this to be visible. A tab left
        # open on the dashboard sends `POST /timeseries` with a JSON content
        # type, which is not a simple request, so the browser asks OPTIONS first
        # — and answering that 503 too makes the failure a CORS error, which
        # says nothing about maintenance. 204 here, 503 on the real request.
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "*" always;
            add_header Access-Control-Max-Age 60 always;
            add_header Content-Length 0 always;
            return 204;
        }

        add_header Access-Control-Allow-Origin "*" always;
        add_header Retry-After 3600 always;
        add_header Cache-Control "no-store" always;
        return 503 '{"detail":"The service is down for scheduled database maintenance. Please try again later.","error":{"code":"maintenance"}}';
    }
}
